name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=3m

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -v ./...

  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Create KIND cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: autotunnel-test

      - name: Deploy test services
        run: kubectl apply -f tests/integration/manifests/

      - name: Wait for pods
        run: |
          # Original services
          kubectl wait --for=condition=ready pod -l app=nginx -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=echo -n autotunnel-test --timeout=120s
          # New services for expanded test coverage
          kubectl wait --for=condition=ready pod -l app=nginx-tls -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=echo-named-ports -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=multi-port -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=websocket-echo -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=standalone-pod -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=echo-headers -n autotunnel-test --timeout=120s
          # TCP echo services
          kubectl wait --for=condition=ready pod -l app=tcp-echo -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=tcp-echo-alt -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=tcp-echo-standalone -n autotunnel-test --timeout=120s
          # Socat/jump-host test services
          kubectl wait --for=condition=ready pod -l app=bastion-jump -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=bastion-standalone -n autotunnel-test --timeout=120s
          kubectl wait --for=condition=ready pod -l app=tcp-target -n autotunnel-test --timeout=120s

      - name: Build binary
        run: go build -o autotunnel .

      - name: Run integration tests
        run: go test -v -tags=integration ./tests/integration/...
        env:
          K8S_CONTEXT: kind-autotunnel-test

      - name: Cleanup
        if: always()
        run: kind delete cluster --name autotunnel-test || true
